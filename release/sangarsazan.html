<script>(function(root,factory){if(typeof module==='object')module.exports=factory();else root.StoryEngine=factory()})(globalThis,function(){
 'use strict';
 const VERSION=1;
 class Engine{
 constructor(chapter,saved){this.chapter=chapter;this.nodes=chapter.nodes;this.state={version:VERSION,chapter:chapter.id,node:chapter.start,flags:{},journal:[],history:[],stats:{care:0,resolve:0},visited:[]};if(saved)this.restore(saved);this.enter()}
 current(){return this.nodes[this.state.node]}
 enter(){const n=this.current();if(!n)throw Error('Unknown node');if(!this.state.visited.includes(this.state.node)){this.state.visited.push(this.state.node);if(n.note)this.note(n.note);if(n.effects)this.effects(n.effects)}return n}
 note(note){if(!this.state.journal.some(x=>x.id===note.id))this.state.journal.push({...note})}
 effects(e){if(e.flags)Object.assign(this.state.flags,e.flags);if(e.stats)for(const [k,v]of Object.entries(e.stats))this.state.stats[k]=(this.state.stats[k]||0)+v;if(e.note)this.note(e.note)}
 available(){return (this.current().choices||[]).filter(c=>!c.requires||c.requires.every(f=>this.state.flags[f]))}
 go(id){if(!this.nodes[id])throw Error('Unknown destination: '+id);const n=this.current();this.state.history.push({node:this.state.node,speaker:n.speaker||'روایت',text:n.text||n.title||''});this.state.node=id;return this.enter()}
 next(){const n=this.current();if(n.type==='choice'||n.type==='inspect'||n.type==='puzzle'||n.type==='ending')throw Error('Interaction required');return this.go(n.next)}
 choose(id){const c=this.available().find(x=>x.id===id);if(!c)throw Error('Choice unavailable');if(c.effects)this.effects(c.effects);this.state.history.push({speaker:'انتخاب شما',text:c.label});return this.go(c.next)}
 inspect(id){const n=this.current();if(n.type!=='inspect')throw Error('Not an inspection');const item=n.items.find(x=>x.id===id);if(!item)throw Error('Unknown evidence');this.state.flags[id]=true;if(item.note)this.note(item.note);return item}
 finishInspection(){const n=this.current();if(n.type!=='inspect')throw Error('Not an inspection');if(!n.required.every(x=>this.state.flags[x]))return false;this.go(n.next);return true}
 solve(order){const n=this.current();if(n.type!=='puzzle')throw Error('Not a puzzle');const ok=JSON.stringify(order)===JSON.stringify(n.solution);if(ok){this.effects({flags:{bridgeSolved:true},note:{id:'sequence',title:'ترتیب کار ثبت شد',text:'بازدید، آماده‌سازی قطعه، اتصال، بازبینی. این ترتیب صرفاً معمای داستانی است.'}});this.go(n.next)}return ok}
 export(){return JSON.stringify(this.state)}
 restore(raw){const s=typeof raw==='string'?JSON.parse(raw):raw;const obj=x=>x&&typeof x==='object'&&!Array.isArray(x);const str=x=>typeof x==='string'&&x.length<=10000;
 if(!s||s.version!==VERSION||s.chapter!==this.chapter.id||!Object.hasOwn(this.nodes,s.node)||!Array.isArray(s.journal)||!Array.isArray(s.history)||!Array.isArray(s.visited)||!obj(s.flags)||!obj(s.stats))throw Error('Invalid save');
 if(s.journal.length>300||s.history.length>2000||s.visited.length>Object.keys(this.nodes).length||s.visited.some(x=>!Object.hasOwn(this.nodes,x))||s.journal.some(x=>!obj(x)||!str(x.id)||!str(x.title)||!str(x.text))||s.history.some(x=>!obj(x)||!str(x.speaker)||!str(x.text))||Object.entries(s.flags).some(([k,v])=>!/^\w{1,80}$/.test(k)||['__proto__','constructor','prototype'].includes(k)||typeof v!=='boolean')||Object.values(s.stats).some(x=>!Number.isFinite(x)||x<0||x>10000)||!Number.isFinite(s.stats.care)||!Number.isFinite(s.stats.resolve))throw Error('Invalid save data');
 this.state=JSON.parse(JSON.stringify(s))}
 }
 function validate(c){if(!c.nodes[c.start])throw Error('Invalid start');for(const [id,n] of Object.entries(c.nodes)){for(const dest of [n.next,...(n.choices||[]).map(x=>x.next)].filter(Boolean))if(!c.nodes[dest])throw Error(id+' → '+dest);if(n.type==='puzzle'&&(!n.solution||new Set(n.solution).size!==n.items.length))throw Error('Invalid puzzle')}return true}
 return {Engine,validate,VERSION};
});

 desk:{type:'inspect',scene:'tent',title:'میز مأموریت',text:'سه مدرک را باز کن. نشانه‌ها در دفتر مأموریت می‌مانند.',required:['report','label','map'],items:[{id:'report',title:'گزارش ساحل',icon:'≋',text:'گروه ساحل نوشته است: «قطعه‌های نشان آبی به محل آزمایش رسیده‌اند. پیش از انتقال، برچسب‌ها با فهرست کارگاه تطبیق داده شوند.»',note:{id:'report',title:'گزارش ساحل',text:'قطعات نشان آبی به محل آزمایش رسیده‌اند. تطبیق برچسب پیش از انتقال لازم است.'}},{id:'label',title:'برچسب کارگاه',icon:'▱',text:'روی برگه دو نشان دیده می‌شود: آبی، آماده بازبینی؛ زرد، نیازمند بررسی کارگاه. قطعه‌ای که یونس آورد نشان زرد داشت.',note:{id:'label',title:'دو نشان متفاوت',text:'آبی: آماده بازبینی. زرد: نیازمند بررسی. قطعه ابتدای مأموریت نشان زرد داشت.'}},{id:'map',title:'طرح مسیر',icon:'⌁',text:'روی طرح، کارگاه در ساحل و محل آزمایش کمی آن‌سوتر مشخص شده است. این نقشه برای بازی طراحی شده و موقعیت جغرافیایی دقیق را نشان نمی‌دهد.',note:{id:'map',title:'طرح شماتیک مسیر',text:'کارگاه ← ساحل ← محل آزمایش. نقشه بازی شماتیک است.'}}],next:'question',objective:'گزارش، برچسب و طرح مسیر را بخوان'},

function home(){screen='home';scene('marsh');main.innerHTML=`<section class="home"><div class="home-copy"><div class="eyebrow">فصل اول · خیبر</div><h1>راهی<br>میان <em>آب</em></h1><p class="intro">اینجا قهرمان، راهی می‌سازد که دیگران از آن بگذرند.<br>در نقش یک جهادگر جوان، نشانه‌ها را بخوان، تصمیم بگیر و کنار گروهت بمان.</p><div class="home-buttons">${readSave()?'<button class="primary" data-action="continue">ادامه مأموریت ←</button><button data-action="new">شروع دوباره</button>':'<button class="primary" data-action="new">شروع مأموریت ←</button>'}<button class="quiet" data-action="chapters">عملیات‌ها</button></div><div class="chapter-tag">یک مأموریت کوتاه برای تجربه هسته بازی<br>گفت‌وگو · کشف نشانه · انتخاب · ساختن</div></div><div class="scene-caption"><b>هور؛ سکوتی پیش از حرکت</b>برداشتی تصویری از فضای عملیات خیبر<br>نسخه نمونه، با طراحی و شخصیت‌های موقت</div></section>`}

else if(n.type==='puzzle'){content=`<section class="content-panel"><div class="panel-kicker">میز کار گروه</div><h2>${n.title}</h2><p class="panel-copy">${n.text}</p><div class="slots">${[0,1,2,3].map((_,i)=>`<div class="slot ${order[i]?'filled':''}"><span>گام ${digits(i+1)}</span>${order[i]?n.items.find(x=>x.id===order[i]).label:'کارت را انتخاب کن'}</div>`).join('')}</div><div class="puzzle-bank">${n.items.map(i=>`<button data-card="${i.id}" ${order.includes(i.id)?'disabled':''}>${i.label}</button>`).join('')}</div><div class="panel-actions"><button class="primary" data-action="checkPuzzle" ${order.length===4?'':'disabled'}>بررسی ترتیب</button><button data-action="resetPuzzle">چیدن دوباره</button><span id="puzzleFeedback" class="hint" role="status"></span></div><p class="notice">این فعالیت، معمای داستانی است و آموزش فنی ساخت پل نیست.</p></section>`}
else if(n.type==='ending'){content=`<section class="ending"><div class="end-seal">◇</div><div class="panel-kicker">مأموریت نمونه به پایان رسید</div><h2>${n.title}</h2><p>${n.text}</p><h3>${n.outcome}</h3><div class="stats"><div><strong>${digits(engine.state.stats.care)}</strong>تصمیم همراه با دقت</div><div><strong>${digits(engine.state.journal.length)}</strong>یادداشت ثبت‌شده</div><div><strong>${digits(engine.state.visited.length)}</strong>صحنه تجربه‌شده</div></div><p class="notice">انتخاب‌های شما روند همین مأموریت خیالی را تغییر دادند؛ نتیجه تاریخی عملیات تغییر نمی‌کند.</p><button class="primary" data-action="journal">مرور دفتر مأموریت</button><button data-action="new">تجربه مسیر دیگر</button><button class="quiet" data-action="home">صفحه اصلی</button></section>`}
else{content=`<div class="stage">${n.portrait?`<div class="portrait ${n.side||'right'}" role="img" aria-label="تصویر موقت ${esc(n.speaker)}">${GameArt.portrait(n.portrait)}</div>`:''}<div class="location-label">${{marsh:'ساحل هور',workshop:'کارگاه مهندسی',tent:'چادر مأموریت',bridge:'مسیر آزمایشی',dawn:'نزدیک روشنایی'}[n.scene]||''}</div></div><section class="dialogue" aria-live="polite"><div class="speaker">${esc(n.speaker)}</div><p>${esc(n.text)}</p>${n.type==='choice'?`<div class="choice-list">${engine.available().map(c=>`<button data-choice="${c.id}">${esc(c.label)}</button>`).join('')}</div>`:''}<div class="dialogue-bottom"><span class="save-status">${saveOk?'پیشرفت در این مرورگر ذخیره می‌شود':'ذخیره خودکار در دسترس نیست'} · ${digits(engine.state.visited.length)} صحنه</span>${n.type!=='choice'?'<button class="primary next" data-action="next">ادامه ←</button>':'<span class="save-status">یک پاسخ را انتخاب کن</span>'}</div></section>`}
main.innerHTML=`<section class="game">${top}${content}</section>`;window.scrollTo({top:0,behavior:'instant'});
}
function journal(){if(!engine){modal('دفتر مأموریت','<p>پس از شروع بازی، سرنخ‌ها و گزارش تصمیم‌ها اینجا ثبت می‌شوند.</p>');return}modal('دفتر مأموریت',engine.state.journal.length?engine.state.journal.map(i=>`<article class="journal-entry"><h3>${esc(i.title)}</h3><p>${esc(i.text)}</p></article>`).join(''):'<p>هنوز یادداشتی ثبت نشده. اولین مدرک را که پیدا کنی، اینجا می‌ماند.</p>')}
function map(){modal('طرح شماتیک مأموریت',`<svg class="map-svg" viewBox="0 0 600 320" role="img" aria-label="نقشه شماتیک کارگاه، ساحل و مسیر آزمایش"><rect width="600" height="320" rx="8" fill="#afb498"/><path d="M0 150Q100 100 210 170T600 170V320H0Z" fill="#718f87"/><g stroke="#455d4e" fill="none" stroke-dasharray="7 7" stroke-width="3"><path d="M100 95L280 155 470 240"/></g><g font-family="Tahoma" font-size="17" text-anchor="middle" fill="#263e34">${[{x:100,y:95,id:'workshop',t:'کارگاه'},{x:280,y:155,id:'shore',t:'ساحل'},{x:470,y:240,id:'test',t:'محل آزمایش'}].map(i=>`<g class="map-location" data-map="${i.id}" role="button" tabindex="0" aria-label="${i.t}"><circle cx="${i.x}" cy="${i.y}" r="16" fill="#dccc9c" stroke="#415b4e" stroke-width="3"/><text x="${i.x}" y="${i.y-30}">${i.t}</text></g>`).join('')}</g></svg><p id="mapInfo" class="map-note">روی هر نقطه بزن تا توضیحش را بخوانی.</p><p class="notice">این تصویر نقشه جغرافیایی یا نظامی واقعی نیست. فقط ارتباط مکان‌های داستان را نشان می‌دهد.</p>`)}
function hint(){if(!engine){toast('اول مأموریت را شروع کن.');return}const n=engine.current();let t=n.type==='inspect'?'هر سه کارت روی میز را باز کن؛ بعد دکمه برگشت به گفت‌وگو فعال می‌شود.':n.type==='puzzle'?(hintCount++?'ترتیب: بازدید اولیه، آماده‌سازی قطعه، اتصال قطعه، بازبینی نهایی.':'یادداشت یونس را بخوان. پیش از دست‌زدن به قطعه چه می‌کنی؟ پس از اتصال چه چیزی باقی می‌ماند؟'):n.type==='choice'?'می‌توانی به دفتر برگردی و نشانه‌ها را مرور کنی. انتخاب اشتباه بن‌بست ایجاد نمی‌کند، اما روی روند مأموریت اثر می‌گذارد.':n.type==='ending'?'می‌توانی دفتر را مرور کنی یا برای تجربه انتخاب‌های دیگر از نو شروع کنی.':'دکمه ادامه را بزن. دفتر و نقشه در طول گفت‌وگو در دسترس هستند.';modal('راهنمای این بخش',`<p>${t}</p>`)}
function chapters(){modal('عملیات‌ها',`<div class="chapter-card"><span class="panel-kicker">قابل بازی</span><h3>خیبر · راهی میان آب</h3><p>یک مأموریت نمونه برای آزمایش گفت‌وگو، تصمیم‌ها و فعالیت‌های تعاملی.</p><button class="primary" data-action="${readSave()?'continue':'confirmNew'}">${readSave()?'ادامه مأموریت':'ورود به مأموریت'}</button></div><div class="chapter-card locked"><h3>عملیات بعدی</h3><p>هنوز محتوایی برای این بخش ساخته نشده است.</p></div>`)}
function menu(){modal('فهرست',`<div class="menu-grid">${engine?'<button data-action="resume">بازگشت به بازی</button><button data-action="journal">دفتر مأموریت</button><button data-action="history">مرور گفت‌وگوها</button><button data-action="export">دریافت فایل ذخیره</button>':''}<button data-action="import">ورود فایل ذخیره</button><button data-action="chapters">عملیات‌ها</button><button data-action="about">درباره این نسخه</button><button data-action="home">صفحه اصلی</button></div>`)}
function exportSave(){if(!engine)return;const blob=new Blob([engine.export()],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sangarsazan-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('فایل ذخیره دریافت شد.')}
function importSave(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{const file=input.files[0];if(!file)return;if(file.size>500000){toast('این فایل بیش از حد بزرگ است.');return}try{const raw=await file.text();new StoryEngine.Engine(CHAPTERS[0],raw);pendingImport=raw;modal('ورود ذخیره',`<p>فایل معتبر است. پیشرفت فعلی با این فایل جایگزین شود؟</p><button class="primary" data-action="confirmImport">بارگذاری ذخیره</button><button data-action="close">بازگشت</button>`)}catch{toast('فایل ذخیره معتبر نیست.')}};input.click()}
async function toggleSound(){try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();const buffer=audio.createBuffer(1,audio.sampleRate*3,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.12;const noise=audio.createBufferSource();noise.buffer=buffer;noise.loop=true;const filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=280;const gain=audio.createGain();gain.gain.value=.15;noise.connect(filter).connect(gain).connect(audio.destination);noise.start();await audio.suspend()}sound=!sound;await audio[sound?'resume':'suspend']();$('#sound').textContent=sound?'صدا روشن':'صدا خاموش';$('#sound').setAttribute('aria-pressed',String(sound))}catch{toast('صدای محیط در این مرورگر پشتیبانی نمی‌شود.')}}
const actions={new:requestNew,confirmNew:()=>{close();newGame()},continue:()=>{close();continueGame()},home:()=>{close();home()},next:()=>{engine.next();save();render()},journal,map,hint,chapters,menu,close,resume:close,export:exportSave,import:importSave,confirmImport:()=>{engine=new StoryEngine.Engine(CHAPTERS[0],pendingImport);pendingImport=null;order=[];save();close();render()},finishInspect:()=>{if(engine.finishInspection()){save();render()}},resetPuzzle:()=>{order=[];render()},checkPuzzle:()=>{if(engine.solve(order)){order=[];save();render()}else{$('#puzzleFeedback').textContent='این ترتیب جور درنمی‌آید. کارت‌ها را دوباره بچین؛ راهنما هم در دسترس است.'}},history:()=>modal('گفت‌وگوهای گذشته',engine.state.history.map(i=>`<div class="history-entry"><span>${esc(i.speaker)}</span><p>${esc(i.text)}</p></div>`).join('')||'<p>هنوز گفت‌وگویی ثبت نشده.</p>'),about:()=>modal('درباره این نسخه','<p>سنگرسازان / جهادگران، هسته بازی روایی دوبعدی با یک مأموریت نمونه از فضای خیبر است. نقش بازیکن و یونس خیالی‌اند. تمام دیالوگ‌های منتسب به مهندس پورشریفی در این نمونه بازآفرینی نویسنده‌اند و نقل‌قول مستند نیستند.</p><p>پس‌زمینه‌ها و چهره‌ها طرح موقت‌اند. این نسخه شامل بازی کامل ۲۰ تا ۳۰ دقیقه‌ای، صداگذاری و بسته اندروید نیست.</p><p>مبنای اولیه: فایل پژوهشی خیبر ارائه‌شده توسط متین. تاریخ‌ها، جزئیات و انتساب‌های ناسازگار آن، پیش از نگارش نسخه نهایی باید با منابع دست‌اول بررسی شوند.</p><p>نسخه ۰.۱ · بدون حساب کاربری · بدون ارسال ذخیره‌ها به سرور</p>')};
document.addEventListener('click',ev=>{const el=ev.target.closest('button,[data-map]');if(!el||el.disabled)return;if(el.dataset.action){actions[el.dataset.action]?.();return}if(el.dataset.choice){engine.choose(el.dataset.choice);save();render();return}if(el.dataset.inspect){const item=engine.inspect(el.dataset.inspect);save();render();modal(item.title,`<p>${esc(item.text)}</p><button class="primary" data-action="close">ثبت شد؛ برگشت به میز</button>`);return}if(el.dataset.card){order.push(el.dataset.card);render();return}if(el.dataset.map){$('#mapInfo').textContent={workshop:'کارگاه: تطبیق برچسب‌ها و هماهنگی با گروه مهندسی.',shore:'ساحل: دریافت گزارش و هماهنگی گروه.',test:'محل آزمایش: فعالیت چهارکارتی و بازبینی نهایی.'}[el.dataset.map]}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.map){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return}if(overlay.open||['BUTTON','INPUT','A'].includes(e.target.tagName))return;if((e.key===' '||e.key==='Enter')&&screen==='game'&&engine.current().type==='dialogue'){e.preventDefault();actions.next()}});
$('#closeModal').onclick=close;$('#menuButton').onclick=menu;$('#brand').onclick=e=>{e.preventDefault();if(screen==='game')menu();else home()};$('#sound').onclick=toggleSound;overlay.addEventListener('click',e=>{if(e.target===overlay){const r=overlay.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&audio)audio.suspend();else if(audio&&sound)audio.resume()});
StoryEngine.validate(CHAPTERS[0]);home();
})();
</script></body></html>
